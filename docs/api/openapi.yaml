openapi: 3.1.0
info:
  title: Anclora FileStudio Service API
  version: 1.1.0
paths:
  /api/v1/health:
    get:
      responses:
        "200":
          description: Process is alive
  /api/v1/ready:
    get:
      responses:
        "200":
          description: Dependencies are ready
        "503":
          description: Not ready
  /api/v1/metrics:
    get:
      responses:
        "200":
          description: Prometheus metrics
  /api/v1/agent-pairing-requests:
    post:
      responses:
        "201":
          description: Pairing code created
  /api/v1/agent/jobs/available:
    get:
      responses:
        "200":
          description: Local Agent job
        "204":
          description: No job available
  /api/v1/agent-jobs:
    post:
      summary: Create a Local Agent job
      security:
        - bearerAuth:
            - filestudio:agent-jobs:create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [input, meta]
              properties:
                input:
                  type: string
                  format: binary
                meta:
                  type: string
                  description: JSON object with operation, options, requestingOrg, requestingApp, retentionMinutes, timeoutMs, deviceId, workspaceId, inputFilename and inputMimeType.
      responses:
        "202":
          description: Job queued for a paired Local Agent
          content:
            application/json:
              schema:
                type: object
                required: [jobId, status, operation, links]
                properties:
                  jobId: { type: string }
                  status:
                    type: string
                    enum: [queued, processing, completed, failed, cancelled, expired]
                  operation: { type: string }
                  links:
                    type: object
                    properties:
                      self: { type: string }
                      events: { type: string }
        "400":
          description: VALIDATION_FAILED
        "403":
          description: AUTH_INSUFFICIENT_SCOPE
        "413":
          description: UPLOAD_TOO_LARGE
        "415":
          description: UPLOAD_MIME_REJECTED
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
