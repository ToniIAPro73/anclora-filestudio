name: release-filestudio

# Builds the ONLY three artifacts users ever download — from THE TAGGED
# COMMIT (never re-uses local/VPS-built artifacts) — verifies them for real,
# and publishes a GitHub Release only if every gate below passes:
#
#   Windows : Anclora-FileStudio-Setup-Windows-x64.exe   (installer)
#   macOS   : Anclora-FileStudio-macOS-arm64.dmg          (Apple Silicon)
#   Linux   : Anclora-FileStudio-Linux-x64.tar.zst        (portable)
#
# Windows/macOS portables are still built INTERNALLY as build payload for the
# installer/.app — they are implementation detail, never uploaded as a
# workflow artifact and never published to a GitHub Release. Only the final
# user-facing product per platform is built, verified, and shipped.
#
# Trigger:
#   - push a tag matching v* → full pipeline, publish=true
#   - workflow_dispatch      → full pipeline, publish=<input> (default false,
#                               i.e. a dry run: build + verify + smoke +
#                               upload workflow artifacts, no public Release)
#
# This workflow never talks to the Anclora VPS, Caddy, or
# filestudio.dev.anclora.com — every artifact it publishes is built fresh on
# GitHub-hosted runners from this repository's own source.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub Release (unchecked = dry run: build + verify + smoke, artifacts uploaded to the workflow run only)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PNPM_VERSION: "10.33.2"
  NODE_VERSION: "22.13.1"

jobs:
  # ── Gate 1: same checks as ci.yml's ci-core ──────────────────────────────
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install Linux integration test toolchain
        run: bash scripts/ci/setup-linux-test-toolchain.sh
      - run: pnpm test
      - run: pnpm build

  # ── Gate 2a: Linux portable — the Linux user-facing product, unchanged ────
  linux-portable:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install packaging + engine binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd ffmpeg poppler-utils qpdf pandoc tesseract-ocr p7zip-full yt-dlp
      - run: pnpm build:portable:linux
      - run: bash scripts/verify-linux-portable.sh
      - run: bash scripts/smoke-linux-portable.sh
      - name: Verify provenance matches this commit
        run: |
          set -euo pipefail
          MANIFEST_COMMIT="$(tar --use-compress-program=zstd -xOf dist/linux/Anclora-FileStudio-Linux-x64.tar.zst Anclora-FileStudio-Linux-x64/manifest.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).commitFull))")"
          echo "Manifest commit: $MANIFEST_COMMIT"
          echo "Workflow commit: $GITHUB_SHA"
          [[ "$MANIFEST_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::Linux portable manifest commit does not match GITHUB_SHA"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-portable
          path: |
            dist/linux/Anclora-FileStudio-Linux-x64.tar.zst
            dist/linux/Anclora-FileStudio-Linux-x64.tar.zst.sha256
          if-no-files-found: error
          retention-days: 14

  # ── Gate 2b: macOS DMG — the ONLY macOS user-facing product ───────────────
  #    The arm64 portable is built here purely as INTERNAL_BUILD_PAYLOAD for
  #    the .app bundle; it is never uploaded as a workflow artifact and never
  #    published to the Release. Only the DMG is.
  macos-dmg:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install optional engine binaries (Homebrew, build host only)
        run: |
          brew install ffmpeg poppler qpdf pandoc tesseract yt-dlp sevenzip

      # ── Internal build payload: arm64 portable (never uploaded) ──────────
      - name: Build internal payload (macOS arm64 portable)
        run: pnpm build:portable:macos
      - name: Verify internal payload structure
        run: bash scripts/verify-macos-portable.sh
      - name: Verify internal payload provenance matches this commit
        run: |
          set -euo pipefail
          MANIFEST_COMMIT="$(python3 -c "import zipfile,json; print(json.loads(zipfile.ZipFile('dist/macos/Anclora-FileStudio-macOS-arm64.zip').read('Anclora-FileStudio-macOS-arm64/manifest.json'))['commitFull'])")"
          echo "Manifest commit: $MANIFEST_COMMIT"
          echo "Workflow commit: $GITHUB_SHA"
          [[ "$MANIFEST_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::macOS internal payload manifest commit does not match GITHUB_SHA"; exit 1; }
      - name: Smoke test internal payload (real boot, before wrapping into .app)
        run: bash scripts/smoke-macos-portable.sh

      # ── .app bundle, wrapping the already-verified internal payload ──────
      - name: Build .app bundle
        run: bash scripts/build-macos-app.sh
      - name: Verify .app bundle
        run: bash scripts/verify-macos-app.sh
      - name: Verify .app provenance matches this commit
        run: |
          set -euo pipefail
          COMMIT="$(python3 -c "import json; print(json.load(open('dist/macos/app-staging/Anclora FileStudio.app/Contents/Resources/app-build-info.json'))['commitFull'])")"
          echo "app-build-info commit: $COMMIT"
          echo "Workflow commit:       $GITHUB_SHA"
          [[ "$COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::macOS .app build commit does not match GITHUB_SHA"; exit 1; }

      # ── DMG — the actual user-facing product ─────────────────────────────
      - name: Build DMG
        run: bash scripts/build-macos-dmg.sh
      - name: Verify DMG (mount + inspect)
        run: bash scripts/verify-macos-dmg.sh
      - name: Smoke test .app (real 'open' launch, health, single-instance, relaunch, shutdown, no orphans)
        run: bash scripts/smoke-macos-app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/release/Anclora-FileStudio-macOS-arm64.dmg
            dist/release/Anclora-FileStudio-macOS-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  # ── Gate 2c: Windows Setup.exe — the ONLY Windows user-facing product ────
  #    The x64 portable is built here purely as INTERNAL_BUILD_PAYLOAD for
  #    the installer; it is never uploaded as a workflow artifact and never
  #    published to the Release. Only Setup.exe is.
  windows-setup:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # ── Internal build payload: x64 portable (never uploaded) ────────────
      - name: Build internal payload (Windows portable)
        shell: bash
        run: bash scripts/build-windows-portable.sh
      - name: Verify internal payload structure
        shell: bash
        run: bash scripts/verify-windows-portable-v2.sh
      - name: Verify internal payload provenance matches this commit
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_COMMIT="$(python3 -c "import zipfile,json; print(json.loads(zipfile.ZipFile('dist/windows/Anclora-FileStudio-Windows-x64-Core.zip').read('Anclora-FileStudio-Windows-x64-Core/manifest.json'))['commitFull'])")"
          echo "Manifest commit: $MANIFEST_COMMIT"
          echo "Workflow commit: $GITHUB_SHA"
          [[ "$MANIFEST_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::Windows internal payload manifest commit does not match GITHUB_SHA"; exit 1; }
      - name: Smoke test internal payload (real boot, before staging the installer)
        shell: bash
        run: bash scripts/smoke-windows-portable.sh

      # ── Installer staging: extract the already-verified internal payload ─
      - name: Stage installer payload from the internal portable
        shell: bash
        run: |
          set -euo pipefail
          # Stage into a short RUNNER_TEMP path: ISCC fails with "The system
          # cannot find the path specified" once a source path exceeds 260
          # chars, and deep .next/node_modules files hit that limit under the
          # default dist/installer-staging layout.
          export ANCLORA_INSTALLER_STAGING_BASE="$RUNNER_TEMP/fs-stage"
          bash scripts/build-windows-installer-staging.sh
          echo "INSTALLER_STAGING_DIR=$(cygpath -w "$RUNNER_TEMP/fs-stage/Anclora-FileStudio-Windows-x64-Core")" >> "$GITHUB_ENV"
          STAGED_MANIFEST_COMMIT="$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/fs-stage/Anclora-FileStudio-Windows-x64-Core/manifest.json'))['commitFull'])")"
          echo "Staged manifest commit: $STAGED_MANIFEST_COMMIT"
          echo "Workflow commit:        $GITHUB_SHA"
          [[ "$STAGED_MANIFEST_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::Installer staging manifest commit does not match GITHUB_SHA"; exit 1; }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $isccPath = Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup 6" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $isccPath) { throw "ISCC.exe not found after installing Inno Setup" }
          echo "ISCC=$($isccPath.FullName)" >> $env:GITHUB_ENV

      - name: Resolve version/commit for installer metadata
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT_SHORT=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"

      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          # Absolute short StagingDir — see staging step comment (MAX_PATH).
          & "$env:ISCC" `
            /DStagingDir="$env:INSTALLER_STAGING_DIR" `
            /DAppVersion="$env:APP_VERSION" `
            /DBuildCommit="$env:BUILD_COMMIT" `
            /DBuildCommitShort="$env:BUILD_COMMIT_SHORT" `
            installer\windows\filestudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed with exit code $LASTEXITCODE" }

      - name: Verify Setup.exe was produced
        shell: bash
        run: |
          set -euo pipefail
          F="dist/release/Anclora-FileStudio-Setup-Windows-x64.exe"
          [[ -f "$F" ]] || { echo "::error::Setup.exe not found: $F"; exit 1; }
          SIZE=$(stat -c%s "$F" 2>/dev/null || stat -f%z "$F")
          [[ "$SIZE" -gt 0 ]] || { echo "::error::Setup.exe is empty"; exit 1; }
          sha256sum "$F"
          echo "Setup.exe size: $SIZE bytes"

      - name: Installer smoke test (silent install → health → silent uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Setup = "dist\release\Anclora-FileStudio-Setup-Windows-x64.exe"
          $InstallDir = "$env:LOCALAPPDATA\Anclora\FileStudio"

          Write-Host "== INSTALL =="
          $p = Start-Process -FilePath $Setup -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exited with code $($p.ExitCode)" }
          if (-not (Test-Path "$InstallDir\INICIAR_ANCLORA_FILESTUDIO.bat")) { throw "Launcher not found after install" }
          Write-Host "[PASS] INSTALL"

          Write-Host "== INSTALLED PAYLOAD PROVENANCE =="
          if (-not (Test-Path "$InstallDir\manifest.json")) { throw "manifest.json not found after install" }
          $installedManifest = Get-Content "$InstallDir\manifest.json" -Raw | ConvertFrom-Json
          $expectedCommit = $env:GITHUB_SHA
          if ($installedManifest.commitFull -ne $expectedCommit) { throw "Installed manifest.commitFull ($($installedManifest.commitFull)) does not match GITHUB_SHA ($expectedCommit)" }
          Write-Host "[PASS] INSTALLED PAYLOAD PROVENANCE ($($installedManifest.commitFull))"

          Write-Host "== LAUNCHER =="
          if (-not (Test-Path "$InstallDir\manifest.json")) { throw "manifest.json not found after install" }
          Write-Host "[PASS] LAUNCHER"

          Write-Host "== SHORTCUT TARGET =="
          $desktopLnk = Join-Path ([Environment]::GetFolderPath('Desktop')) "Anclora FileStudio.lnk"
          if (-not (Test-Path $desktopLnk)) { throw "Desktop shortcut not found" }
          $wsh = New-Object -ComObject WScript.Shell
          $sc = $wsh.CreateShortcut($desktopLnk)
          if ($sc.TargetPath -like "*INICIAR_ANCLORA_FILESTUDIO.bat") { throw "Shortcut still points directly at the .bat: $($sc.TargetPath)" }
          $expectedHost = Join-Path $env:SystemRoot "System32\wscript.exe"
          if (-not $sc.TargetPath.Equals($expectedHost, [System.StringComparison]::OrdinalIgnoreCase)) { throw "Shortcut target is not wscript.exe: $($sc.TargetPath)" }
          $silentVbs = Join-Path $InstallDir "INICIAR_ANCLORA_FILESTUDIO_SILENCIOSO.vbs"
          if ($sc.Arguments -notlike "*INICIAR_ANCLORA_FILESTUDIO_SILENCIOSO.vbs*") { throw "Shortcut arguments do not reference the silent launcher: $($sc.Arguments)" }
          Write-Host "[PASS] SHORTCUT TARGET (wscript.exe + silent VBS)"

          Write-Host "== SILENT LAUNCHER =="
          if (-not (Test-Path $silentVbs)) { throw "Silent launcher VBS not found after install" }
          $vbsText = Get-Content $silentVbs -Raw
          if ($vbsText -notmatch "INICIAR_ANCLORA_FILESTUDIO\.bat") { throw "Silent launcher VBS does not reference the .bat" }
          if ($vbsText -notmatch "WScript\.Shell") { throw "Silent launcher VBS does not use WScript.Shell" }
          Write-Host "[PASS] SILENT LAUNCHER (VBS references the .bat)"

          Write-Host "== SHORTCUT LAUNCH (real shortcut, single-instance check) =="
          # Launch the actual desktop shortcut the way a user double-click
          # does. Must end with exactly ONE server instance; browser windows
          # are not validated (not reliable on CI runners).
          $portFile = Join-Path $InstallDir "data\anclora-filestudio.port"
          $quotedShortcut = '"' + $desktopLnk + '"'
          $wsh.Run($quotedShortcut, 1, $false) | Out-Null
          $serverReady = $false
          for ($attempt = 1; $attempt -le 60; $attempt++) {
              if (Test-Path $portFile) {
                  try {
                      $port = (Get-Content $portFile -Raw).Trim()
                      $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 3 -ErrorAction Stop
                      if ($health.StatusCode -eq 200) { $serverReady = $true; break }
                  } catch { }
              }
              Start-Sleep -Seconds 2
          }
          if (-not $serverReady) { throw "Server did not become healthy after launching the desktop shortcut" }
          $serverInstances = @(Get-Process -Name node -ErrorAction SilentlyContinue | Where-Object { $_.Path -and $_.Path -ieq "$InstallDir\runtime\node.exe" })
          if ($serverInstances.Count -ne 1) { throw "Expected exactly 1 server instance after shortcut launch, found $($serverInstances.Count)" }
          Write-Host "[PASS] SHORTCUT LAUNCH: single server instance (PID $($serverInstances[0].Id))"

          Write-Host "== APP START (direct launcher: existing-instance path) =="
          Push-Location $InstallDir
          & ".\internal\start-anclora-filestudio.ps1" -BaseDir $InstallDir -SkipBrowser
          Pop-Location
          Write-Host "[PASS] APP START"

          Write-Host "== HEALTH =="
          $port = (Get-Content $portFile -Raw).Trim()
          $health = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/health" -UseBasicParsing -TimeoutSec 10
          if ($health.StatusCode -ne 200) { throw "Health endpoint returned $($health.StatusCode)" }
          Write-Host "[PASS] HEALTH"

          Write-Host "== STOP =="
          & "$InstallDir\internal\stop-anclora-filestudio.ps1" -BaseDir $InstallDir
          Write-Host "[PASS] STOP"

          Write-Host "== UNINSTALL =="
          $uninstallEntry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            Get-ItemProperty | Where-Object { $_.DisplayName -eq "Anclora FileStudio" } | Select-Object -First 1
          if (-not $uninstallEntry) { throw "Uninstall registry entry not found" }
          $uninstExe = $uninstallEntry.UninstallString -replace '"',''
          $p = Start-Process -FilePath $uninstExe -ArgumentList "/VERYSILENT","/NORESTART","/SUPPRESSMSGBOXES" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller exited with code $($p.ExitCode)" }
          if (Test-Path "$InstallDir\INICIAR_ANCLORA_FILESTUDIO.bat") { throw "Launcher still present after uninstall" }
          Write-Host "[PASS] UNINSTALL"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: dist/release/Anclora-FileStudio-Setup-Windows-x64.exe
          if-no-files-found: error
          retention-days: 14

  # ── Gate 3: assemble checksums/manifest, verify cross-artifact provenance
  #    by CONTENT (not mere file existence), publish a GitHub Release only if
  #    every prior gate passed AND publish=true ────────────────────────────
  package:
    needs: [validate, linux-portable, macos-dmg, windows-setup]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-portable
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: windows-setup
          path: dist/release

      - name: Resolve version/tag/publish
        id: meta
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG="${GITHUB_REF#refs/tags/}"
            IS_TAG=true
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG=""
            IS_TAG=false
          fi
          PUBLISH="${{ github.event.inputs.publish }}"
          if [[ "$IS_TAG" == "true" ]]; then PUBLISH=true; fi
          if [[ -z "$PUBLISH" ]]; then PUBLISH=false; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION | Tag: ${TAG:-<none>} | Publish: $PUBLISH"

      - name: Verify cross-artifact provenance (by content, not file existence)
        run: |
          set -euo pipefail
          command -v 7z >/dev/null 2>&1 || sudo apt-get install -y p7zip-full
          command -v innoextract >/dev/null 2>&1 || sudo apt-get install -y innoextract

          LINUX_COMMIT="$(tar --use-compress-program=zstd -xOf dist/linux/Anclora-FileStudio-Linux-x64.tar.zst Anclora-FileStudio-Linux-x64/manifest.json | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).commitFull))")"
          echo "Linux portable commit: $LINUX_COMMIT"
          echo "Workflow commit:       $GITHUB_SHA"
          [[ "$LINUX_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::Linux portable provenance mismatch"; exit 1; }

          [[ -f dist/release/Anclora-FileStudio-macOS-arm64.dmg ]] || { echo "::error::macOS DMG artifact missing"; exit 1; }
          [[ -f dist/release/Anclora-FileStudio-macOS-arm64.dmg.sha256 ]] || { echo "::error::macOS DMG checksum missing"; exit 1; }
          DMG_COMMIT="$(7z e -so dist/release/Anclora-FileStudio-macOS-arm64.dmg "Anclora FileStudio/Anclora FileStudio.app/Contents/Resources/app-build-info.json" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('commitFull', ''))" || true)"
          echo "macOS DMG commit: $DMG_COMMIT"
          [[ -n "$DMG_COMMIT" ]] || { echo "::error::Could not extract app-build-info.json from DMG"; exit 1; }
          [[ "$DMG_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::macOS DMG provenance mismatch (expected $GITHUB_SHA, got $DMG_COMMIT)"; exit 1; }

          [[ -f dist/release/Anclora-FileStudio-Setup-Windows-x64.exe ]] || { echo "::error::Windows Setup.exe artifact missing"; exit 1; }
          rm -rf /tmp/win-setup-extract && mkdir -p /tmp/win-setup-extract
          innoextract -e -d /tmp/win-setup-extract dist/release/Anclora-FileStudio-Setup-Windows-x64.exe
          WIN_MANIFEST="$(find /tmp/win-setup-extract -name manifest.json | head -1)"
          [[ -n "$WIN_MANIFEST" ]] || { echo "::error::Could not find manifest.json inside Setup.exe payload"; exit 1; }
          WINDOWS_COMMIT="$(python3 -c "import json; print(json.load(open('$WIN_MANIFEST'))['commitFull'])")"
          echo "Windows Setup.exe commit: $WINDOWS_COMMIT"
          [[ "$WINDOWS_COMMIT" == "$GITHUB_SHA" ]] || { echo "::error::Windows Setup.exe provenance mismatch (expected $GITHUB_SHA, got $WINDOWS_COMMIT)"; exit 1; }

      - name: Generate release manifest + checksums
        run: |
          node scripts/generate-release-manifest.mjs \
            --dir dist/release \
            --version "${{ steps.meta.outputs.version }}" \
            --commit "$GITHUB_SHA" \
            --linux-tar dist/linux/Anclora-FileStudio-Linux-x64.tar.zst \
            --macos-dmg dist/release/Anclora-FileStudio-macOS-arm64.dmg \
            --windows-setup dist/release/Anclora-FileStudio-Setup-Windows-x64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: |
            dist/linux/Anclora-FileStudio-Linux-x64.tar.zst
            dist/release/Anclora-FileStudio-macOS-arm64.dmg
            dist/release/Anclora-FileStudio-macOS-arm64.dmg.sha256
            dist/release/Anclora-FileStudio-Setup-Windows-x64.exe
            dist/release/SHA256SUMS.txt
            dist/release/release-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: steps.meta.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${{ steps.meta.outputs.tag }}" ]]; then
            echo "::error::publish=true but no tag was pushed — refusing to create an untagged Release"
            exit 1
          fi
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "Anclora FileStudio ${{ steps.meta.outputs.tag }}" \
            --notes "Commit: $GITHUB_SHA

          Windows: Installer / Setup — Anclora-FileStudio-Setup-Windows-x64.exe (unsigned — SmartScreen will warn, see docs/RELEASE_WINDOWS_INSTALLER.md)
          macOS Apple Silicon (arm64): DMG containing Anclora FileStudio.app — drag to /Applications
            - UNSIGNED, UNNOTARIZED — Gatekeeper will show a warning on first launch (see docs/portable-macos.md for the one-time authorization steps)
          Linux: Portable package — Anclora-FileStudio-Linux-x64.tar.zst

          Checksums: see SHA256SUMS.txt / release-manifest.json" \
            dist/linux/Anclora-FileStudio-Linux-x64.tar.zst \
            dist/release/Anclora-FileStudio-macOS-arm64.dmg \
            dist/release/Anclora-FileStudio-macOS-arm64.dmg.sha256 \
            dist/release/Anclora-FileStudio-Setup-Windows-x64.exe \
            dist/release/SHA256SUMS.txt \
            dist/release/release-manifest.json
