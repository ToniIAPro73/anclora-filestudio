name: ci

on:
  push:
    branches: [main, development, staging, production, "feat/**"]
  pull_request:

env:
  PNPM_VERSION: "10.33.2"
  NODE_VERSION: "22.13.1"

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.classify.outputs.code }}
      workflow: ${{ steps.classify.outputs.workflow }}
      integration: ${{ steps.classify.outputs.integration }}
      service: ${{ steps.classify.outputs.service }}
      local_agent: ${{ steps.classify.outputs.local_agent }}
      contracts: ${{ steps.classify.outputs.contracts }}
      security: ${{ steps.classify.outputs.security }}
      docker: ${{ steps.classify.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Detect code changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE"
            head="$PR_HEAD"
          else
            base="$PUSH_BEFORE"
            head="$PUSH_AFTER"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "workflow=true" >> "$GITHUB_OUTPUT"
            echo "integration=true" >> "$GITHUB_OUTPUT"
            echo "service=true" >> "$GITHUB_OUTPUT"
            echo "local_agent=true" >> "$GITHUB_OUTPUT"
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            echo "security=true" >> "$GITHUB_OUTPUT"
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=false
          workflow=false
          integration=false
          service=false
          local_agent=false
          contracts=false
          security=false
          docker=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/**|*.md|.anclora/**)
                ;;
              .github/workflows/**)
                workflow=true
                if [[ "$path" == ".github/workflows/ci.yml" ]]; then
                  code=true; integration=true; service=true; local_agent=true; contracts=true; security=true; docker=true
                fi
                ;;
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|tsconfig*.json|eslint.config.*)
                code=true; integration=true; service=true; local_agent=true; contracts=true; security=true; docker=true
                ;;
              tests/**|vitest*.config.ts|vitest*.config.mts|scripts/toolchain.lock.json)
                code=true; integration=true
                if [[ "$path" == tests/security/** ]]; then security=true; fi
                ;;
              src/lib/security/**|apps/api/src/auth/**)
                code=true; security=true
                if [[ "$path" == apps/api/* ]]; then service=true; fi
                ;;
              src/lib/engines/**|src/app/api/**|apps/worker/**)
                code=true; integration=true; docker=true
                ;;
              apps/api/**|packages/core/**|packages/sdk/**)
                code=true; service=true; integration=true; docker=true
                ;;
              apps/local-agent/**)
                code=true; local_agent=true
                ;;
              packages/integrations/anclora-nexus/**)
                code=true; contracts=true
                ;;
              deploy/vps/**|Dockerfile*|docker-compose*.yml)
                code=true; docker=true
                ;;
              *)
                code=true
                ;;
            esac
          done < <(git diff --name-only -z "$base" "$head")

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "workflow=$workflow" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "local_agent=$local_agent" >> "$GITHUB_OUTPUT"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "security=$security" >> "$GITHUB_OUTPUT"
          echo "docker=$docker" >> "$GITHUB_OUTPUT"

  ci-config:
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  ci-core:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:core

  ci-integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Restore Linux integration toolchain cache
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives/*.deb
          key: ubuntu-24.04-${{ runner.arch }}-linux-toolchain-${{ hashFiles('scripts/ci/setup-linux-test-toolchain.sh', 'scripts/toolchain.lock.json') }}
      - name: Restore pinned Chromium runtime cache
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/anclora-filestudio/runtime-packs/chromium-runtime
          key: ubuntu-24.04-${{ runner.arch }}-chromium-runtime-${{ hashFiles('scripts/toolchain.lock.json') }}
      - name: Install Linux integration test toolchain
        run: bash scripts/ci/setup-linux-test-toolchain.sh
      - run: pnpm test

  ci-service:
    needs: changes
    if: needs.changes.outputs.service == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anclora/filestudio-api typecheck
      - run: pnpm --filter @anclora/filestudio-api test
      - run: pnpm build:service

  ci-local-agent:
    needs: changes
    if: needs.changes.outputs.local_agent == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:local-agent
      - run: pnpm build:local-agent

  ci-contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:routing
      - run: pnpm test:nexus-contract

  ci-security:
    needs: changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:security
      - run: pnpm audit --prod
      - run: pnpm audit:licenses
      - run: pnpm generate:sbom

  ci-docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    # Dummy, CI-only values so Compose can interpolate deploy/vps/compose.yml.
    # They are not credentials and never reach any real environment.
    env:
      DATABASE_URL: postgresql://ci:ci-placeholder@postgres:5432/ci
      POSTGRES_PASSWORD: ci-placeholder-postgres
      REDIS_PASSWORD: ci-placeholder-redis
      PUBLIC_BASE_URL: https://filestudio.ci.invalid
      JWT_ISSUER: https://filestudio.ci.invalid
      YOUTUBE_WORKER_TOKEN: ci-placeholder-worker-token-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: docker compose -f deploy/vps/compose.yml config -q
      - run: docker compose -f deploy/vps/compose.yml build --no-cache

  ci-release:
    runs-on: ubuntu-24.04
    needs: [changes, ci-core]
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v4
      - run: echo "Release packaging is manual; this job validates metadata only."
